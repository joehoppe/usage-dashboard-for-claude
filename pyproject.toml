[project]
name = "claude-usage"
version = "0.1.0"
description = "Usage Dashboard for Claude: desktop and CLI views of Claude Code subscription quota"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["wxPython"]

[project.optional-dependencies]
# pytest-cov is MIT; the coverage.py it pulls in is Apache-2.0. Both sit
# inside the licence allowlist in AGENTS.md.
test = ["pytest", "pytest-cov"]

[project.scripts]
claude-usage = "claude_usage.ui.cli.main:main"
claude-usage-app = "claude_usage.ui.app.main:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_usage*"]

[tool.setuptools.package-data]
"claude_usage.ui.app" = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# An unregistered marker is a typo, not a feature: without this a
# misspelled @pytest.mark.skipif silently never skips anything.
addopts = "--strict-markers"

[tool.coverage.run]
source = ["claude_usage"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
